<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETA Dashboard</title>
    <meta name="theme-color" content="#0b1120" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: radial-gradient(circle at top, #111827 0%, #020817 55%, #020617 100%);
      }
      .glass {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(18px);
      }
    </style>
  </head>
  <body class="min-h-screen text-slate-100 font-sans antialiased">
    <div class="max-w-5xl mx-auto px-4 py-10">
      <header class="flex items-center justify-between gap-4 mb-8">
        <div>
          <p class="font-mono text-xs uppercase tracking-[0.25em] text-cyan-300">AUH</p>
          <h1 class="text-3xl font-bold">ETA Dashboard</h1>
        </div>
      </header>

      <main class="grid gap-6 lg:grid-cols-[1fr_1.2fr]">
        <section class="glass border border-slate-800 rounded-3xl p-6 shadow-2xl">
          <div class="flex items-center justify-between mb-6">
            <div>
              <p class="font-mono text-[10px] uppercase tracking-[0.28em] text-cyan-300">Access</p>
              <h2 class="text-2xl font-bold">Welcome back</h2>
            </div>
            <div class="w-10 h-10 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 flex items-center justify-center">
              <span>✓</span>
            </div>
          </div>

          <form id="login-form" class="space-y-4" novalidate>
            <div>
              <label for="name-input" class="block text-xs uppercase tracking-[0.18em] text-slate-400 mb-2">Name</label>
              <input id="name-input" type="text" placeholder="e.g. Ali Raza" class="w-full rounded-2xl border border-slate-700 bg-slate-950/80 px-4 py-3 text-base text-white placeholder:text-slate-400 focus:border-cyan-400 focus:outline-none" />
            </div>

            <div>
              <label for="role-input" class="block text-xs uppercase tracking-[0.18em] text-slate-400 mb-2">Role</label>
              <select id="role-input" class="w-full rounded-2xl border border-slate-700 bg-slate-950/80 px-4 py-3 text-base text-white focus:border-cyan-400 focus:outline-none">
                <option value="Ops Controller">Ops Controller</option>
                <option value="Aircraft Dispatcher">Aircraft Dispatcher</option>
                <option value="Ramp Controller">Ramp Controller</option>
                <option value="Load Control">Load Control</option>
                <option value="Station Coordinator">Station Coordinator</option>
                <option value="Duty Manager">Duty Manager</option>
                <option value="Supervisor">Supervisor</option>
              </select>
            </div>

            <div>
              <label for="password-input" class="block text-xs uppercase tracking-[0.18em] text-slate-400 mb-2">Password</label>
              <input id="password-input" type="password" placeholder="Enter your password" class="w-full rounded-2xl border border-slate-700 bg-slate-950/80 px-4 py-3 text-base text-white placeholder:text-slate-400 focus:border-cyan-400 focus:outline-none" />
            </div>

            <p id="login-error" class="hidden rounded-xl border border-rose-500/30 bg-rose-500/10 px-3 py-2 text-sm text-rose-200"></p>

            <button type="submit" class="w-full rounded-2xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-3 transition shadow-lg shadow-cyan-500/20">
              Sign In
            </button>
          </form>

          <div class="mt-6 pt-4 border-t border-slate-800 text-sm text-slate-400">
            Demo quick access:
            <button id="demo-btn" class="text-cyan-300 hover:text-cyan-200 font-semibold">Continue as Demo User</button>
          </div>
        </section>

        <section class="glass border border-slate-800 rounded-3xl p-6 shadow-2xl">
          <div class="mb-6">
            <p class="font-mono text-[10px] uppercase tracking-[0.28em] text-emerald-300">Overview</p>
            <h2 class="text-2xl font-bold">Operations Dashboard</h2>
          </div>

          <div class="grid gap-4 sm:grid-cols-3 mb-6">
            <div class="rounded-2xl border border-slate-800 bg-slate-900/80 p-4">
              <div class="text-[10px] uppercase tracking-[0.2em] text-slate-400">Flights</div>
              <div class="mt-2 text-3xl font-extrabold font-mono text-cyan-300">12</div>
            </div>
            <div class="rounded-2xl border border-slate-800 bg-slate-900/80 p-4">
              <div class="text-[10px] uppercase tracking-[0.2em] text-slate-400">Recent</div>
              <div class="mt-2 text-3xl font-extrabold font-mono text-emerald-300">0</div>
            </div>
            <div class="rounded-2xl border border-slate-800 bg-slate-900/80 p-4">
              <div class="text-[10px] uppercase tracking-[0.2em] text-slate-400">Favourites</div>
              <div class="mt-2 text-3xl font-extrabold font-mono text-amber-300">0</div>
            </div>
          </div>

          <div class="rounded-2xl border border-slate-800 bg-slate-950/60 p-4">
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-bold text-lg">Open ETA tools</h3>
              <span class="text-cyan-300">→</span>
            </div>
            <div class="space-y-2">
              <a href="calculator.html" class="block rounded-xl border border-slate-700 bg-slate-900/80 px-3 py-2 hover:border-cyan-400 transition">
                Open calculator
              </a>
              <button type="button" id="clear-session" class="w-full rounded-xl border border-slate-700 bg-slate-900/80 px-3 py-2 text-left hover:border-rose-400 transition">
                Clear session
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const userKey = 'auhEtaUser';
      const sessionKey = 'auhEtaSession';
      const loginForm = document.getElementById('login-form');
      const demoBtn = document.getElementById('demo-btn');
      const loginError = document.getElementById('login-error');
      const clearSessionBtn = document.getElementById('clear-session');

      function getUserPassword(user) {
        if (!user) return '';
        return String(user.password ?? user.pin ?? '').trim();
      }

      function clearSession() {
        localStorage.removeItem(userKey);
        localStorage.removeItem(sessionKey);
      }

      function readUser() {
        try {
          const raw = localStorage.getItem(userKey);
          if (!raw) return null;
          const user = JSON.parse(raw);
          if (!user || !user.name || !getUserPassword(user)) return null;
          return { ...user, password: getUserPassword(user) };
        } catch (error) {
          return null;
        }
      }

      function showError(message) {
        loginError.textContent = message;
        loginError.classList.remove('hidden');
      }

      function hideError() {
        loginError.textContent = '';
        loginError.classList.add('hidden');
      }

      function saveSession(user) {
        const normalized = {
          name: String(user.name || '').trim(),
          role: String(user.role || '').trim(),
          password: String(getUserPassword(user) || user.password || '').trim()
        };

        if (!normalized.name || !normalized.password) {
          return false;
        }

        localStorage.setItem(userKey, JSON.stringify(normalized));
        localStorage.setItem(sessionKey, normalized.password);
        return true;
      }

      function redirectToDashboard() {
        window.location.replace('dashboard.html');
      }

      function completeLogin(name, role, password) {
        if (!name || !password) {
          showError('Please enter your name and password.');
          return;
        }

        const saved = saveSession({ name, role, password });
        if (!saved) {
          showError('Login failed. Please try again.');
          return;
        }

        redirectToDashboard();
      }

      function validateExistingSession() {
        const user = readUser();
        const session = localStorage.getItem(sessionKey);
        const password = getUserPassword(user);

        if (user && password && session === password) {
          redirectToDashboard();
          return true;
        }

        if (user || session) {
          clearSession();
        }

        return false;
      }

      loginForm.addEventListener('submit', function (event) {
        event.preventDefault();
        hideError();

        const name = document.getElementById('name-input').value.trim();
        const role = document.getElementById('role-input').value;
        const password = document.getElementById('password-input').value.trim();

        completeLogin(name, role, password);
      });

      demoBtn.addEventListener('click', function () {
        completeLogin('Demo User', 'Aircraft Dispatcher', 'demo');
      });

      clearSessionBtn.addEventListener('click', function () {
        clearSession();
        window.location.reload();
      });

      validateExistingSession();
    </script>
  </body>
</html>
